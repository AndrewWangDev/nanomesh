<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>404 - NanoMesh</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css?v=74">
  <style>
    .not-found-card {
      text-align: center;
      padding: 3rem 2rem;
    }
    .not-found-icon {
      font-size: 4rem;
      margin-bottom: 1rem;
    }
    .not-found-title {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 1rem;
    }
    .not-found-desc {
      color: var(--text-secondary);
      margin-bottom: 2rem;
      line-height: 1.5;
    }
    .redirect-text {
      margin-top: 1.5rem;
      font-size: 0.85rem;
      color: var(--text-secondary);
    }
  </style>
  <link rel="icon" href="/favicon.ico?v=20261022" sizes="any">
  <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png?v=20261022">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=20261022">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=20261022">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=20261022">
  <link rel="manifest" href="/site.webmanifest">
</head>
<body>
  <div class="auth-container">
    <div class="auth-header">
      <div class="mesh-logo">◎</div>
      <h1 data-i18n="app.name">NanoMesh 灵微络</h1>
      <p class="subtitle" data-i18n="app.subtitle">智能微模型编排平台</p>
    </div>
    
    <div class="card not-found-card">
      <div class="not-found-icon">🛸</div>
      <h2 class="not-found-title" data-i18n="error.404.title">404 - 页面未找到</h2>
      <p class="not-found-desc" data-i18n="error.404.desc">您访问的页面不存在或已被移除。</p>
      
      <button class="btn btn-primary" style="width: 100%; margin-top: 1rem;" onclick="window.location.href='/'">
        <span data-i18n="error.404.backHome">返回首页</span>
      </button>
      
      <div class="redirect-text" id="redirect-text">
        <span data-i18n="error.404.redirecting">5 秒后自动返回首页...</span>
      </div>
    </div>

    <div class="auth-footer" style="margin-top: 2rem; display: flex; justify-content: center; gap: 1rem;">
      <button class="btn-text" id="lang-toggle">中 / EN</button>
      <button class="btn-text" id="theme-toggle">☀ / 🌙</button>
    </div>
  </div>

  <script type="module">
    import { init, t, setLocale, getLocale } from './i18n.js?v=74';

    document.addEventListener('DOMContentLoaded', () => {
      init();

      // Setup lang toggle
      const langToggle = document.getElementById('lang-toggle');
      if (langToggle) {
        langToggle.addEventListener('click', () => {
          setLocale(getLocale() === 'zh' ? 'en' : 'zh');
          updateCountdownText();
        });
      }

      // Setup theme toggle
      const themeToggle = document.getElementById('theme-toggle');
      if (themeToggle) {
        themeToggle.addEventListener('click', () => {
          const current = document.documentElement.getAttribute('data-theme') || 'dark';
          const next = current === 'dark' ? 'light' : 'dark';
          document.documentElement.setAttribute('data-theme', next);
          localStorage.setItem('nanomesh-theme', next);
        });
      }

      // Restore theme
      const savedTheme = localStorage.getItem('nanomesh-theme');
      if (savedTheme) {
        document.documentElement.setAttribute('data-theme', savedTheme);
      }

      // Countdown logic
      let countdown = 5;
      const redirectTextEl = document.querySelector('[data-i18n="error.404.redirecting"]');
      
      function updateCountdownText() {
        if (redirectTextEl) {
          redirectTextEl.textContent = t('error.404.redirecting', { s: countdown });
        }
      }
      
      updateCountdownText();

      const interval = setInterval(() => {
        countdown--;
        updateCountdownText();
        
        if (countdown <= 0) {
          clearInterval(interval);
          window.location.href = '/';
        }
      }, 1000);
    });
  </script>
</body>
</html>
