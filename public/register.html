<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>NanoMesh - Register</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css?v=1791272211581">
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?onload=onloadTurnstileCallback&render=explicit" async defer></script>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="shortcut icon" href="/favicon.ico">
  <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png">
  <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
</head>
<body>
  <div class="auth-container">
    <div class="auth-header">
      <div class="mesh-logo">◎</div>
      <h1 data-i18n="app.name">NanoMesh</h1>
      <p class="subtitle" data-i18n="app.subtitle">Intelligent Micro-Model Orchestration</p>
    </div>

    <div class="card">
      <form id="register-form">
        <div class="input-group">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2M12 11a4 4 0 100-8 4 4 0 000 8z"></path></svg>
          <input type="text" id="username" class="input-field" data-i18n="auth.username" placeholder="Username" required>
        </div>

        <div class="input-group" style="display:flex; gap:0.5rem; margin-bottom: 0.5rem;">
          <div style="position:relative; flex:1; display:flex">
            <svg class="input-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
            <input type="text" id="email-prefix" class="input-field" data-i18n="auth.email" placeholder="Email" required style="border-right: 0; border-top-right-radius: 0; border-bottom-right-radius: 0; flex:7;">
            <div class="custom-select" style="flex:3;">
              <div class="select-trigger" id="email-domain-trigger" style="height:100%; border-left:0; border-top-left-radius:0; border-bottom-left-radius:0; outline:none;">
                <span id="email-domain-value">@gmail.com</span>
                <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"></polyline></svg>
              </div>
              <div class="select-options" id="email-domain-options" style="display:none; bottom: auto; top: 100%; margin-top: 4px; margin-bottom: 0;">
                <div class="select-option" data-value="@gmail.com">@gmail.com</div>
                <div class="select-option" data-value="@outlook.com">@outlook.com</div>
                <div class="select-option" data-value="@yahoo.com">@yahoo.com</div>
                <div class="select-option" data-value="@proton.me">@proton.me</div>
                <div class="select-option" data-value="@icloud.com">@icloud.com</div>
                <div class="select-option" data-value="@hotmail.com">@hotmail.com</div>
              </div>
            </div>
            <input type="hidden" id="email-domain" value="@gmail.com">
          </div>
        </div>
        
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 0.5rem;">
          <label style="font-size: 0.85rem; color: var(--text-secondary);" data-i18n="auth.enterCode">Please enter verification code</label>
          <button type="button" id="btn-send-code" class="text-btn" disabled data-i18n="auth.sendCode" style="font-size:0.85rem; padding:0; background:none; border:none; color:var(--accent-color); cursor:pointer;">Send Code</button>
        </div>
        
        <div class="verification-code" id="code-inputs">
          <input type="text" class="code-box" maxlength="1">
          <input type="text" class="code-box" maxlength="1">
          <input type="text" class="code-box" maxlength="1">
          <input type="text" class="code-box" maxlength="1">
          <input type="text" class="code-box" maxlength="1">
          <input type="text" class="code-box" maxlength="1">
        </div>

        <div class="input-group" style="margin-bottom: 0;">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
          <input type="password" id="password" class="input-field" data-i18n="auth.password" placeholder="Password" required>
          <div class="input-action toggle-password" data-target="password">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
          </div>
        </div>
        <div class="pwd-strength" id="pwd-strength">
          <div class="pwd-segment"></div><div class="pwd-segment"></div><div class="pwd-segment"></div>
          <span class="pwd-hint" id="pwd-hint" data-i18n="auth.passwordRule"></span>
        </div>

        <div class="input-group" id="confirm-pwd-group" style="margin-bottom: 0; margin-top: 0.5rem;">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
          <input type="password" id="confirm-password" class="input-field" data-i18n="auth.confirmPassword" placeholder="Confirm Password" required>
          <div class="input-action toggle-password" data-target="confirm-password">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
          </div>
        </div>
        <div class="pwd-error-space" id="pwd-error-space">
          <span id="pwd-error-msg" style="display:none; color:var(--error-color); font-size:0.75rem; align-items:center; gap:0.25rem;">
            <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
            <span data-i18n="auth.passwordMismatch"></span>
          </span>
        </div>

        <div class="input-group">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 12 20 22 4 22 4 12"></polyline><rect x="2" y="7" width="20" height="5"></rect><line x1="12" y1="22" x2="12" y2="7"></line><path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z"></path><path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"></path></svg>
          <input type="text" id="referral-code" class="input-field" data-i18n-placeholder="auth.referralCodePlaceholder" placeholder="Referral Code (optional)" maxlength="9" autocomplete="off" style="text-transform: uppercase;">
        </div>

        <div class="turnstile-wrapper">
          <div class="turnstile-widget" id="turnstile-container" data-theme="dark"></div>
        </div>

        <div class="terms-agreement-row">
          <label class="terms-checkbox-label">
            <input type="checkbox" id="terms-checkbox" checked>
            <span class="terms-checkbox-text" data-i18n="auth.termsAgreement" data-i18n-html>
              已阅读并同意<a href="/terms" class="terms-link">服务条款</a>和<a href="/privacy" class="terms-link">隐私政策</a>
            </span>
          </label>
        </div>

        <button type="submit" class="btn btn-primary w-full register-btn glow" data-i18n="auth.register">Register</button>
      </form>

      <div class="divider" data-i18n="auth.orContinueWith">Or continue with</div>

      <button type="button" class="btn-oauth btn-github" id="btn-github">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M12 2C6.477 2 2 6.477 2 12c0 4.42 2.865 8.166 6.839 9.489.5.092.682-.217.682-.482 0-.237-.008-.866-.013-1.7-2.782.603-3.369-1.34-3.369-1.34-.454-1.156-1.11-1.464-1.11-1.464-.908-.62.069-.608.069-.608 1.003.07 1.531 1.03 1.531 1.03.892 1.529 2.341 1.087 2.91.831.092-.646.35-1.086.636-1.336-2.22-.253-4.555-1.11-4.555-4.943 0-1.091.39-1.984 1.029-2.683-.103-.253-.446-1.27.098-2.647 0 0 .84-.269 2.75 1.025A9.578 9.578 0 0112 6.836c.85.004 1.705.114 2.504.336 1.909-1.294 2.747-1.025 2.747-1.025.546 1.379.203 2.394.1 2.647.64.699 1.028 1.592 1.028 2.683 0 3.842-2.339 4.687-4.566 4.935.359.309.678.919.678 1.852 0 1.336-.012 2.415-.012 2.743 0 .267.18.578.688.48C19.138 20.161 22 16.418 22 12c0-5.523-4.477-10-10-10z"></path></svg>
        <span data-i18n="auth.loginWithGithub">GitHub</span>
      </button>
      
      <button type="button" class="btn-oauth btn-google" id="btn-google">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M12.24 10.285V14.4h6.806c-.275 1.765-2.056 5.174-6.806 5.174-4.095 0-7.439-3.389-7.439-7.574s3.344-7.574 7.439-7.574c2.33 0 3.891.989 4.785 1.849l3.254-3.138C18.189 1.186 15.479 0 12.24 0c-6.635 0-12 5.365-12 12s5.365 12 12 12c6.926 0 11.52-4.869 11.52-11.726 0-.788-.085-1.39-.189-1.989H12.24z"/></svg>
        <span data-i18n="auth.loginWithGoogle">Google</span>
      </button>

      <div class="text-center mt-4">
        <span style="color:var(--text-secondary); font-size:0.85rem;" data-i18n="auth.hasAccount">Already have an account?</span> 
        <a href="/login.html" style="color:var(--accent-color); text-decoration:none; font-size:0.85rem; font-weight:500;">Sign In</a>
      </div>
    </div>

    <div class="footer-actions">
      <button class="action-btn" id="lang-toggle">中 / EN</button>
      <button class="action-btn" id="theme-toggle">☀ / 🌙</button>
    </div>
  </div>

  <div id="toast-container" class="toast-container"></div>

  <script type="module">
    import { init } from './i18n.js?v=1791272211581';
    init();
  </script>
  <script type="module" src="/auth.js?v=1791272211581"></script>
</body>
</html>
